frontend:
  image:
    repository: two-apps/frontend
    tag: "1.0"
  replicas: 1

  apiTokenSecretName: backend-api-token

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector: {}

backend:
  image:
    repository: two-apps/backend
    tag: "1.0"

  replicas: 2

  version: "v1"

  containerPort: 8080

  service:
    name: backend
    port: 8080

  serviceAccount:
    name: backend-sa
    secretName: backend-sa-token

  apiTokenSecretName: backend-api-token

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"

    limits:
      cpu: "200m"
      memory: "128Mi"

  probes:
    readiness:
      path: /ready
      initialDelaySeconds: 3
      periodSeconds: 5

    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values:
                  - backend

  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: backend
          topologyKey: kubernetes.io/hostname

requestInterval: 10
